<!DOCTYPE html>
<html>
<head>
    <title>Triangle Area</title>
</head>

<body>

<script>
    let base = Number(prompt("Enter base of triangle:"));
    let height = Number(prompt("Enter height of triangle:"));

    let area = (base * height) / 2;

    document.write("Area of Triangle = " + area);
</script>

</body>
</html>
