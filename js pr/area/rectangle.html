<html>
<head>
    <title>Area Calculation</title>
</head>
<body>
<script>
    let length = Number(prompt("Enter length:"));
    let breadth = Number(prompt("Enter breadth:"));
    let rectangleArea = length * breadth;
    document.write("Area of Rectangle = " + rectangleArea + "<br><br>");
</script>
</body>
</html>
